name: Images

# Every push to main that changes code builds the operator and portal images,
# publishes them to ghcr.io tagged with the full commit SHA, and then commits
# those tags into the hosted kustomize overlays. Argo CD on the VM watches
# main, sees that commit and rolls the new images out. Nobody runs a command.
#
# The commit made by the last job is pushed with the workflow's own token, and
# GitHub does not start workflows for pushes made that way, so it cannot loop.

on:
  push:
    branches: [main]
    # Documentation and manifests do not change what is inside an image.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "deploy/**"
  workflow_dispatch:

permissions: {}

# A newer push replaces an older run, so the tags in git always end up at the
# newest build and never go back to an older one.
concurrency:
  group: images-main
  cancel-in-progress: true

jobs:
  images:
    name: Build and push ${{ matrix.name }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: operator
            image: ghcr.io/muditjain13/redis-operator
            dockerfile: Dockerfile
          - name: portal
            image: ghcr.io/muditjain13/redis-portal
            dockerfile: Dockerfile.portal
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.image }}:${{ github.sha }}
          # The source label links the package to this repository.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  update-tags:
    name: Point the hosted deployment at the new images
    needs: images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          # This is the only job that keeps the token: it has to push a commit.
          persist-credentials: true

      - name: Set the image tags
        env:
          SHA: ${{ github.sha }}
        run: |
          bash hack/set-image-tag.sh deploy/hosting/operator/kustomization.yaml redis-operator ghcr.io/muditjain13/redis-operator "$SHA"
          bash hack/set-image-tag.sh deploy/hosting/portal/kustomization.yaml redis-portal ghcr.io/muditjain13/redis-portal "$SHA"

      - name: Commit and push the tags
        env:
          SHA: ${{ github.sha }}
        run: |
          if git diff --quiet; then
            echo "The overlays already point at ${SHA}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/hosting/operator/kustomization.yaml deploy/hosting/portal/kustomization.yaml
          git commit -m "Update the hosted images to ${SHA::7}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "Could not push the tags after 3 attempts" >&2
          exit 1
