name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test-e2e:
    permissions:
      # write: publish measured badge data to the "badges" branch (main pushes only)
      contents: write
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      # Creates a kind cluster, deploys the operator, runs the RedisCluster
      # lifecycle tests and writes e2e-metrics/e2e-metrics.json.
      - name: Running Test e2e
        run: make test-e2e

      - name: Build badge data
        run: hack/make-badges.sh e2e e2e-metrics/e2e-metrics.json

      - name: Publish badges
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: hack/publish-badges.sh badge-data
