# Hosted k3s VM: the Cloudflare Tunnel connector. Its token Secret is created by
# hand and is not in git, so Argo CD neither stores nor prunes it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Muditjain13/redis-operator.git
    targetRevision: main
    path: deploy/hosting/cloudflared
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
