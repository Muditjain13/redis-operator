# Puts the demo cluster back to 3 replicas and Redis 7.2 every 10 minutes, so
# whatever visitors did is undone and the page always starts from a known state.
# It runs the portal image's "reset" subcommand, which only patches the
# RedisCluster spec.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: redis-portal-reset
  namespace: demo
  labels:
    app.kubernetes.io/name: redis-portal-reset
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: redis-portal-reset
        spec:
          restartPolicy: Never
          serviceAccountName: redis-portal-reset
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reset
              image: redis-portal
              imagePullPolicy: IfNotPresent
              args:
                - reset
                - --namespace=demo
                - --cluster=rediscluster-sample
                - --replicas=3
                - --version=7.2
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
