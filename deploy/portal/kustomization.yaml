apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ../demo holds the namespace and the RedisCluster the portal shows, so this
# one path is everything the portal Application deploys.
resources:
  - ../demo
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - reset-cronjob.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: redis-operator-demo

# Change the image here (or with `kustomize edit set image`) to deploy a
# published build; the Deployment and the CronJob both use it.
images:
  - name: redis-portal
    newName: redis-portal
    newTag: dev
