apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The namespace itself and the RedisCluster live in ../demo.
resources:
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - reset-cronjob.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: redis-operator-demo

# Change the image here (or with `kustomize edit set image`) to deploy a
# published build; the Deployment and the CronJob both use it.
images:
  - name: redis-portal
    newName: redis-portal
    newTag: dev
