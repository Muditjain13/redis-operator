# One replica on purpose: the rate limiter, the action tracker and the event
# stream live in memory, so a second replica would double every visitor's
# allowance and show a different history.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-portal
  namespace: demo
  labels:
    app.kubernetes.io/name: redis-portal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-portal
    spec:
      serviceAccountName: redis-portal
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          image: redis-portal
          imagePullPolicy: IfNotPresent
          args:
            - --namespace=demo
            - --cluster=rediscluster-sample
            - --cooldown=30s
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
