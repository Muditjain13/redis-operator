# The portal on the hosted k3s VM: deploy/portal plus the three things that only
# make sense when the portal is reached through Cloudflare.
#
# The image is the one the Images workflow published to ghcr.io for a commit.
# That workflow rewrites the images entry below with hack/set-image-tag.sh, in a
# commit of its own, and Argo CD rolls the new tag out. Do not edit it by hand.
# The reset CronJob uses the same image, so it moves with the Deployment.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../portal
  - networkpolicy.yaml

images:
  - name: redis-portal
    newName: ghcr.io/muditjain13/redis-portal
    newTag: "1b2c07de1706fb6dfc0c012fd3225f232ae56630"

patches:
  # Read the visitor address from CF-Connecting-IP, so the rate limit counts
  # visitors instead of counting the tunnel as one visitor. This is only safe
  # because networkpolicy.yaml lets nothing but cloudflared reach the portal.
  - target:
      kind: Deployment
      name: redis-portal
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --trust-proxy-headers
