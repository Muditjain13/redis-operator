# The operator on the hosted k3s VM. Same as deploy/operator; only the image
# differs: it is the one the Images workflow published to ghcr.io for a commit.
# That workflow rewrites the images entry below with hack/set-image-tag.sh, in a
# commit of its own, and Argo CD rolls the new tag out. Do not edit it by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../operator

images:
  - name: redis-operator
    newName: ghcr.io/muditjain13/redis-operator
    newTag: "d9499669b7fb6056a96ba597911719deaca8069a"
