# Cloudflare Tunnel connector. It dials out to Cloudflare, so the VM needs no
# open inbound port. Cloudflare sends visitors for redisoperator.dpdns.org down
# the tunnel to the portal Service; the routing is in configmap.yaml.
#
# The tunnel's credentials file is a secret and is NOT in git. Create the
# Secret by hand from the file `cloudflared tunnel create` wrote:
#   kubectl -n cloudflared create secret generic cloudflared-credentials \
#     --from-file=credentials.json=$HOME/.cloudflared/<tunnel-id>.json
# The origin certificate (cert.pem) is not needed here and must stay off the
# cluster: it can create tunnels and DNS records for the whole zone.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      # cloudflared never calls the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Lets the non-root user read the 0440 credentials file.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.9.3
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
          ports:
            - name: metrics
              containerPort: 2000
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: credentials
              mountPath: /etc/cloudflared/credentials
              readOnly: true
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: credentials
          secret:
            secretName: cloudflared-credentials
            defaultMode: 0440
