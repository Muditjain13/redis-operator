# Codecov configuration. See docs/DESIGN_NOTES.md, "What coverage measures", for
# why each path is excluded. Only code that is neither generated nor
# process wiring nor test support is measured.
ignore:
  # Generated by controller-gen (deepcopy); contains no hand-written logic.
  - "**/zz_generated*.go"
  # Operator entry point: flag parsing and manager wiring, exercised only by
  # running the operator (the e2e suite does that but does not collect coverage).
  - "cmd/**"
  # Test helpers and e2e tests are not production code.
  - "test/**"
